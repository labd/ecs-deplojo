[project]
name="ecs-deplojo"
dynamic = ["version"]
authors = [
    {name = "Lab Digital B.V.", email = "opensource@labdigital.nl"},
]
description="Deployment tool for Amazon ECS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "boto3>=1.36.2",
    "click>=8.1.8",
    "pyaml>=25.1.0",
]

[project.scripts]
ecs-deplojo = "ecs_deplojo.cli:main"

[build-system]
requires = ["setuptools", "setuptools-scm[toml]"]
build-backend = "setuptools.build_meta"

[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
certifi = "2026-10-27T00:00:00Z"  # 2026.10.23 fixes GHSA-6q48-6c7w-9gw2
setuptools = "2026-10-27T00:00:00Z"  # 84.2.1 fixes GHSA-xmj3-9gf7-h52w

[tool.setuptools_scm]                                                                                                                                                                                                                
version_scheme = "guess-next-dev"                                                                                                                                                                                                    
local_scheme = "no-local-version"     

[tool.coverage.run]
branch = true
source = ["ecs_deplojo"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.ruff.lint]
# Explicit list so new ruff defaults don't break CI on upgrade.
select = ["E4", "E7", "E9", "F", "B", "DTZ", "PERF", "PT", "SIM", "UP"]

[dependency-groups]
test = [
    "coverage[toml]>=7.6.10",
    "moto>=5.0.27",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
]
dev = [
    "setuptools-scm>=8.1.0",
]
