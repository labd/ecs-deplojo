[project]
name="ecs-deplojo"
dynamic = ["version"]
authors = [
    {name = "Lab Digital B.V.", email = "opensource@labdigital.nl"},
]
description="Deployment tool for Amazon ECS"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.36.2",
    "click>=8.1.8",
    "pyaml>=25.1.0",
]

[project.scripts]
ecs-deplojo = "ecs_deplojo.cli:main"

[build-system]
requires = ["setuptools", "setuptools-scm[toml]"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]                                                                                                                                                                                                                
version_scheme = "guess-next-dev"                                                                                                                                                                                                    
local_scheme = "no-local-version"     

[tool.coverage.run]
branch = true
source = ["ecs_deplojo"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.ruff.lint]
# Explicit list so new ruff defaults don't break CI on upgrade.
select = ["E4", "E7", "E9", "F", "B", "DTZ", "PERF", "PT", "SIM", "UP"]

[dependency-groups]
test = [
    "coverage[toml]>=7.6.10",
    "moto>=5.0.27",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
]
dev = [
    "setuptools-scm>=8.1.0",
]
